# gitleaks: the default rules. Test fixtures are anonymised before they are
# committed (see each package's testdata/README.md); an allowlist entry must name a
# path and say why, never a commit fingerprint, which breaks on the next edit.
title = "trica"

[extend]
useDefault = true

[allowlist]
description = "Kubernetes canary: a Secret whose data is the marker 'canary-never-read' in base64, there to prove the collector never reads Secrets"
paths = ['''internal/collect/kubernetes/testdata/[^/]+/secrets\.yaml''']
