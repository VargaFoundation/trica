# golangci-lint v2. The version is pinned in the Makefile and in ci.yml.
version: "2"
run:
  # Bounds a stuck run, not a performance target: loading the packages alone
  # took more than 5 minutes on a hosted runner (#87).
  timeout: 10m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # G115 (integer overflow on conversion) fires on every int/int64 cast of
        # bounded values (counts, durations); it is noise here.
        - G115
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/VargaFoundation/trica]
