{{- if not .Values.database.existingSecret }}
{{- fail "database.existingSecret is required: the name of a Secret holding the PostgreSQL URL" }}
{{- end }}
{{- if and .Values.collect.enabled (not .Values.collect.targets) (not .Values.collect.targetsConfigMap) }}
{{- fail "collect.targets or collect.targetsConfigMap is required when collect.enabled: what to collect from" }}
{{- end }}
{{- if and .Values.collect.kubernetes.rbac.enabled (not .Values.collect.enabled) }}
{{- fail "collect.kubernetes.rbac.enabled needs collect.enabled: the role is for the in-server collectors" }}
{{- end }}
{{- if .Values.transport.enabled }}
{{- if not .Values.transport.hosts }}
{{- fail "transport.hosts is required when transport.enabled: the names agents dial" }}
{{- end }}
{{- if not .Values.transport.existingClaim }}
{{- fail "transport.existingClaim is required when transport.enabled: the CA must outlive the pod" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trica.fullname" . }}
  labels:
    {{- include "trica.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trica.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trica.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "trica.serviceAccountName" . }}
      # Only the in-cluster kubernetes collector needs the API token.
      automountServiceAccountToken: {{ and .Values.collect.enabled .Values.collect.kubernetes.rbac.enabled }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: trica
          image: {{ include "trica.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "--config", "/etc/trica/trica.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.transport.enabled }}
            - name: transport
              containerPort: {{ .Values.transport.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            # Migrations run before the server listens.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/trica/trica.yaml
              subPath: trica.yaml
              readOnly: true
            {{- range $name, $_ := .Values.schemaOverlays }}
            - name: config
              mountPath: /etc/trica/schema/{{ $name }}
              subPath: schema-{{ $name }}
              readOnly: true
            {{- end }}
            - name: database
              mountPath: /var/run/secrets/trica
              readOnly: true
            {{- if .Values.collect.enabled }}
            - name: collect-targets
              mountPath: /etc/trica/collect/targets.yaml
              subPath: {{ default "targets.yaml" .Values.collect.targetsKey }}
              readOnly: true
            {{- range .Values.collect.secrets }}
            # Targets refer to these with password: "file:/var/run/secrets/collect/<secret>/<key>".
            - name: collect-secret-{{ .name }}
              mountPath: /var/run/secrets/collect/{{ .name }}
              readOnly: true
            {{- end }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.deviceTypes.existingClaim }}
            - name: devicetypes
              mountPath: /etc/trica/devicetypes
              readOnly: true
              {{- with .Values.deviceTypes.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
            {{- if .Values.transport.enabled }}
            - name: transport-ca
              mountPath: /var/lib/trica/ca
              {{- with .Values.transport.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "trica.fullname" . }}
        - name: database
          secret:
            secretName: {{ .Values.database.existingSecret }}
            items:
              - key: {{ .Values.database.urlKey }}
                path: database-url
        - name: tmp
          emptyDir: {}
        {{- if .Values.collect.enabled }}
        - name: collect-targets
          configMap:
            name: {{ default (include "trica.fullname" .) .Values.collect.targetsConfigMap }}
            {{- if not .Values.collect.targetsConfigMap }}
            items:
              - {key: targets.yaml, path: targets.yaml}
            {{- end }}
        {{- range .Values.collect.secrets }}
        - name: collect-secret-{{ .name }}
          secret:
            secretName: {{ .name }}
            defaultMode: 0440
        {{- end }}
        {{- end }}
        {{- if .Values.deviceTypes.existingClaim }}
        - name: devicetypes
          persistentVolumeClaim:
            claimName: {{ .Values.deviceTypes.existingClaim }}
            readOnly: true
        {{- end }}
        {{- if .Values.transport.enabled }}
        - name: transport-ca
          persistentVolumeClaim:
            claimName: {{ .Values.transport.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
