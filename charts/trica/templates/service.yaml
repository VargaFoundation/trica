apiVersion: v1
kind: Service
metadata:
  name: {{ include "trica.fullname" . }}
  labels:
    {{- include "trica.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.transport.enabled }}
    - name: transport
      port: {{ .Values.transport.port }}
      targetPort: transport
      protocol: TCP
    {{- end }}
  selector:
    {{- include "trica.selectorLabels" . | nindent 4 }}
