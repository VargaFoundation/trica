{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trica.fullname" . }}
  labels:
    {{- include "trica.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trica.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egressTo }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- if .Values.transport.enabled }}
    - from:
        {{- if .Values.transport.ingressFrom }}
        {{- toYaml .Values.transport.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: transport
          protocol: TCP
    {{- end }}
  {{- if .Values.networkPolicy.egressTo }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- toYaml .Values.networkPolicy.egressTo | nindent 4 }}
  {{- end }}
{{- end }}
