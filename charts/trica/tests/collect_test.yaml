suite: in-server collectors
set:
  database.existingSecret: trica-db
tests:
  - it: collects nothing by default
    template: templates/configmap.yaml
    asserts:
      - notMatchRegex: {path: 'data["trica.yaml"]', pattern: collect}
      - notExists: {path: 'data["targets.yaml"]'}
  - it: mounts nothing for collectors by default
    template: templates/deployment.yaml
    asserts:
      - lengthEqual: {path: spec.template.spec.volumes, count: 3}
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: false}
  - it: renders no role by default
    template: templates/collect-rbac.yaml
    asserts:
      - hasDocuments: {count: 0}

  - it: points the server at a targets file rendered from collect.targets
    template: templates/configmap.yaml
    set:
      collect.enabled: true
      collect.targets:
        - {kind: arista, name: sw-a1, address: "https://192.0.2.10", username: monitor, password: "file:/var/run/secrets/collect/arista/password"}
    asserts:
      - matchRegex: {path: 'data["trica.yaml"]', pattern: 'targets_file: /etc/trica/collect/targets.yaml'}
      - matchRegex: {path: 'data["targets.yaml"]', pattern: 'name: sw-a1'}
      - matchRegex: {path: 'data["targets.yaml"]', pattern: 'file:/var/run/secrets/collect/arista/password'}
  - it: mounts the targets file and the credential Secrets read-only
    template: templates/deployment.yaml
    set:
      collect.enabled: true
      collect.targets: [{kind: arista, name: sw-a1}]
      collect.secrets: [{name: arista-credentials}]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: collect-targets, mountPath: /etc/trica/collect/targets.yaml, subPath: targets.yaml, readOnly: true}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: collect-secret-arista-credentials, mountPath: /var/run/secrets/collect/arista-credentials, readOnly: true}
      - contains:
          path: spec.template.spec.volumes
          content: {name: collect-secret-arista-credentials, secret: {secretName: arista-credentials, defaultMode: 288}}
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: false}
  - it: can take the targets file from an existing ConfigMap
    set:
      collect.enabled: true
      collect.targetsConfigMap: site-targets
      collect.targetsKey: site.yaml
    asserts:
      - notExists:
          path: data["targets.yaml"]
        template: templates/configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content: {name: collect-targets, configMap: {name: site-targets}}
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: collect-targets, mountPath: /etc/trica/collect/targets.yaml, subPath: site.yaml, readOnly: true}
        template: templates/deployment.yaml
  - it: refuses to collect from nothing
    template: templates/deployment.yaml
    set: {collect.enabled: true}
    asserts:
      - failedTemplate: {errorPattern: "collect.targets or collect.targetsConfigMap is required"}

  - it: grants read-only access to what the kubernetes collector reads
    template: templates/collect-rbac.yaml
    documentIndex: 0
    set:
      collect.enabled: true
      collect.targets: [{kind: kubernetes, name: prod, address: in-cluster}]
      collect.kubernetes.rbac.enabled: true
    asserts:
      - isKind: {of: ClusterRole}
      - equal: {path: metadata.name, value: RELEASE-NAME-trica-collector}
      # Exactly these rules, reading only: no Secrets, no ConfigMaps, no write.
      - lengthEqual: {path: rules, count: 5}
      - equal: {path: "rules[0].resources", value: [nodes, namespaces, pods, services]}
      - equal: {path: "rules[1].resources", value: [deployments, statefulsets, daemonsets, replicasets]}
      - equal: {path: "rules[2].resources", value: [jobs, cronjobs]}
      - equal: {path: "rules[3].resources", value: [ingresses]}
      - equal: {path: "rules[4].resources", value: [virtualmachineinstances]}
      - equal: {path: "rules[0].verbs", value: [get, list, watch]}
      - equal: {path: "rules[1].verbs", value: [get, list, watch]}
      - equal: {path: "rules[2].verbs", value: [get, list, watch]}
      - equal: {path: "rules[3].verbs", value: [get, list, watch]}
      - equal: {path: "rules[4].verbs", value: [get, list, watch]}
  - it: grants nothing on Argo CD unless asked
    template: templates/collect-rbac.yaml
    set:
      collect.enabled: true
      collect.targets: [{kind: kubernetes, name: prod, address: in-cluster}]
      collect.kubernetes.rbac.enabled: true
    asserts:
      - hasDocuments: {count: 2}
  - it: grants read-only access to the Argo CD Applications of one namespace, when asked
    template: templates/collect-rbac.yaml
    release: {namespace: inventory}
    set:
      collect.enabled: true
      collect.targets: [{kind: kubernetes, name: prod, address: in-cluster}]
      collect.kubernetes.rbac.enabled: true
      collect.kubernetes.rbac.argocd: true
    asserts:
      - hasDocuments: {count: 4}
      - documentIndex: 0
        isKind: {of: ClusterRole}
      # The cluster role is the same as without it: the right is namespaced.
      - documentIndex: 0
        lengthEqual: {path: rules, count: 5}
      - documentIndex: 2
        isKind: {of: Role}
      - documentIndex: 2
        equal: {path: metadata.namespace, value: argocd}
      - documentIndex: 2
        equal: {path: rules, value: [{apiGroups: [argoproj.io], resources: [applications], verbs: [get, list, watch]}]}
      - documentIndex: 3
        isKind: {of: RoleBinding}
      - documentIndex: 3
        equal: {path: metadata.namespace, value: argocd}
      - documentIndex: 3
        equal: {path: roleRef.name, value: RELEASE-NAME-trica-collector-argocd}
      - documentIndex: 3
        equal: {path: "subjects[0].namespace", value: inventory}
  - it: takes the Argo CD namespace from the values
    template: templates/collect-rbac.yaml
    documentIndex: 2
    set:
      collect.enabled: true
      collect.targets: [{kind: kubernetes, name: prod, address: in-cluster}]
      collect.kubernetes.rbac.enabled: true
      collect.kubernetes.rbac.argocd: true
      collect.kubernetes.rbac.argocdNamespace: gitops
    asserts:
      - equal: {path: metadata.namespace, value: gitops}
  - it: binds the role to the chart's service account
    template: templates/collect-rbac.yaml
    documentIndex: 1
    release: {namespace: inventory}
    set:
      collect.enabled: true
      collect.targets: [{kind: kubernetes, name: prod, address: in-cluster}]
      collect.kubernetes.rbac.enabled: true
    asserts:
      - isKind: {of: ClusterRoleBinding}
      - equal: {path: roleRef.name, value: RELEASE-NAME-trica-collector}
      - equal: {path: "subjects[0].name", value: RELEASE-NAME-trica}
      - equal: {path: "subjects[0].namespace", value: inventory}
  - it: mounts the service account token only with the role
    template: templates/deployment.yaml
    set:
      collect.enabled: true
      collect.targets: [{kind: kubernetes, name: prod, address: in-cluster}]
      collect.kubernetes.rbac.enabled: true
    asserts:
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: true}
  - it: refuses the role without the collectors
    template: templates/deployment.yaml
    set: {collect.kubernetes.rbac.enabled: true}
    asserts:
      - failedTemplate: {errorPattern: "collect.kubernetes.rbac.enabled needs collect.enabled"}
