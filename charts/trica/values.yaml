# Default values for trica. Every key is documented in charts/trica/README.md.

image:
  repository: ghcr.io/vargafoundation/trica
  # Defaults to the chart's appVersion.
  tag: ""
  # Set to pin by digest (sha256:...); takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# More than one replica is safe: migrations and the absence sweep take
# PostgreSQL advisory locks.
replicaCount: 1

# PostgreSQL 17 is external (an operator-managed cluster, a managed instance,
# a plain server). The connection URL is read from an existing Secret, mounted as a
# file; the chart never holds it.
database:
  existingSecret: ""
  # Key of the Secret holding postgres://user:password@host:5432/db?sslmode=...
  urlKey: database-url

# Server configuration (docs/reference/configuration.md). http.addr is set by
# the chart.
config:
  log_level: info
  sweep_interval: 1m
  migrate_on_start: true
  policy:
    absent_after: 30m
    propose: ["mcp:*"]
    priorities: []

# Extra schema overlays: custom types and attributes, one key per file.
schemaOverlays: {}
#  site.yaml: |
#    types:
#      device:
#        attributes:
#          cost_center: {kind: string, search: true}

# The operator's own device models and face images (devicetypes.extra_dir,
# docs/reference/devicetypes.md), read at start over the embedded library: a
# photograph of your own equipment replaces the vendor drawing, without a
# rebuild. A claim, not a ConfigMap: images weigh more than a ConfigMap holds,
# and the layout has subdirectories. Mounted read-only; restart to reload.
deviceTypes:
  existingClaim: ""
  subPath: ""

# The look of the console (docs/reference/themes.md). Leave all empty for the
# built-in default. builtin: "default" or "flat". Or a theme of your own, as a
# ConfigMap: either the files of the theme (theme.json, logo.svg, ...) as keys,
# or a zip archive under archiveKey (kubectl create configmap trica-theme
# --from-file=theme.zip). The ConfigMap is mounted read-only at /etc/trica/theme
# and re-read every minute, without a restart.
theme:
  builtin: ""
  existingConfigMap: ""
  archiveKey: ""

service:
  type: ClusterIP
  port: 8080

# Optional Ingress for the HTTP port (UI, REST API, MCP). Controller-agnostic:
# set the class and the annotations your controller needs. With the default
# NetworkPolicy, also list the controller's namespace in
# networkPolicy.ingressFrom, or its traffic is dropped.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Host names, e.g. [trica.example.com].
  hosts: []
  # Standard Ingress TLS entries, e.g.
  #  - secretName: trica-tls
  #    hosts: [trica.example.com]
  tls: []

# Mutual-TLS ingestion for agents and collectors (ADR 0008, 0025), on a port of
# its own. Off by default. The CA lives on a persistent volume: losing it
# invalidates every enrolled agent, so a claim is required (an emptyDir is not
# offered). With several replicas the claim must be ReadWriteMany.
transport:
  enabled: false
  port: 8443
  # Names and IPs the server certificate is valid for: what agents dial.
  hosts: []
  # An existing PersistentVolumeClaim holding the CA (ca.pem, ca-key.pem).
  existingClaim: ""
  subPath: ""
  # Who may reach the transport port. Empty: any pod in the release namespace.
  # Agents outside the cluster arrive through the Service you expose
  # (LoadBalancer or a TLS-passthrough route): list their source here.
  ingressFrom: []

# Collectors run by the server (docs/reference/collectors.md). Off by default.
# Each target is an entry of the targets file; credentials are references to
# files mounted from existing Secrets (collect.secrets), never values.
collect:
  enabled: false
  # Inline targets, rendered into the chart's ConfigMap (no secret in them).
  targets: []
  #  - kind: arista
  #    name: sw-a1
  #    address: https://192.0.2.10
  #    username: monitor
  #    password: file:/var/run/secrets/collect/arista/password
  #    interval: 5m
  # Alternative: an existing ConfigMap holding the targets file, under
  # targetsKey (default targets.yaml). Replaces collect.targets.
  targetsConfigMap: ""
  targetsKey: targets.yaml
  # Existing Secrets to mount, each at /var/run/secrets/collect/<name>/ (one
  # file per key).
  secrets: []
  #  - name: arista-credentials
  kubernetes:
    # Read-only access for a kubernetes target with address "in-cluster": a
    # ClusterRole limited to get/list/watch on what the collector reads, bound
    # to the chart's service account. No Secrets, no ConfigMaps, no write verbs.
    # Mounts the service account token in the pod (otherwise it is not).
    rbac:
      enabled: false

# Live topology overlay (docs/reference/configuration.md#live-topology-overlay,
# ADR 0041): link throughput and state read by the server from a
# Prometheus-compatible endpoint (Prometheus, VictoriaMetrics, Thanos, Mimir).
# Off by default; the browser never reaches the endpoint. With a restricted
# NetworkPolicy (networkPolicy.egressTo), allow the endpoint there.
live:
  enabled: false
  # The server's live block, rendered as is: url and sources are required.
  # Credentials are file: references to the Secrets below, never values.
  config: {}
  #  url: https://metrics.example.net/prometheus
  #  username: trica-reader
  #  password: file:/var/run/secrets/live/metrics-credentials/password
  #  sources:
  #    - kind: node
  #    - kind: arista
  #      matchers: {job: arista-exporter}
  # Existing Secrets to mount, each at /var/run/secrets/live/<name>/ (one file
  # per key): a password, a bearer token, a CA certificate.
  secrets: []
  #  - name: metrics-credentials

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: true
  # Who may reach the HTTP port. Empty: any pod in the release namespace.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels: {kubernetes.io/metadata.name: ingress-system}
  # Where the server may connect besides DNS. The database must be listed;
  # empty allows all egress.
  egressTo: []
  #  - to:
  #      - podSelector: {matchLabels: {app: postgresql}}
  #    ports:
  #      - {port: 5432, protocol: TCP}

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Scheduled logical backup (`trica backup`, ADR 0021) for standalone installs:
# a plain PostgreSQL that takes no backups of its own. A PostgreSQL operator
# with WAL archiving already has physical backups and point-in-time recovery:
# leave this off there.
# The CronJob never deletes old archives; prune them on the volume side.
backup:
  enabled: false
  schedule: "17 2 * * *"
  # The ops image carries pg_dump 17 (docker build --target ops).
  image:
    repository: ghcr.io/vargafoundation/trica-ops
    tag: ""
  # An existing PersistentVolumeClaim receiving the archives. For an
  # S3-compatible target, use a claim backed by an S3 CSI driver or copy the
  # archives off with the tool of your choice; the chart holds no credentials.
  existingClaim: ""
  # Subdirectory of the claim.
  subPath: ""
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
