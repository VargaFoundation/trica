# Server configuration. Every key is documented in docs/reference/configuration.md.
http:
  addr: ":8080"
log_level: info
sweep_interval: 1m
policy:
  # An observed object unseen for this long is marked absent (never deleted).
  absent_after: 30m
  # Batches from these sources wait for a human approval.
  propose: ["mcp:*"]
# Optional components (docs/reference/configuration.md). The REST API, the MCP
# server and the web UI are mounted on the HTTP port. The mutual-TLS transport
# for agents is off until it has a port and a volume for its CA:
#   transport:
#     addr: ":8443"
#     ca_dir: /var/lib/trica/ca   # a volume: losing the CA un-enrols every agent
#     hosts: [trica.example.test]
# and the compose file must then publish 8443 and mount that volume.
# The live topology overlay is off until it has a Prometheus-compatible
# endpoint to read (docs/reference/configuration.md#live-topology-overlay):
#   live:
#     url: http://prometheus.example.test:9090
#     sources:
#       - kind: node
