# A canary: the collector must never list, get or watch Secrets. The tests
# prove it twice, by the recorded requests and by the absence of this value
# from every batch. The value is not a credential, it is a marker.
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-tls
  namespace: shop
  uid: 00000000-0000-4000-8000-000000000f01
type: kubernetes.io/tls
data:
  tls.crt: Y2FuYXJ5LW5ldmVyLXJlYWQ=
  tls.key: Y2FuYXJ5LW5ldmVyLXJlYWQ=
