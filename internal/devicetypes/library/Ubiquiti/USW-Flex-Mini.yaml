    label: Port 1 (PoE IN)
    type: 1000base-t
    poe_mode: pd
    poe_type: type2-ieee802.3at
  - name: Port 2
    type: 1000base-t
  - name: Port 3
    type: 1000base-t
  - name: Port 4
    type: 1000base-t
  - name: Port 5
    type: 1000base-t
