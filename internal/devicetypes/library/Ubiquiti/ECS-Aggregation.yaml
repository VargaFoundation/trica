comments: |
  [Enterprise Campus Aggregation](https://store.ui.com/products/ecs-aggregation)

  High-performance campus aggregation switch with (48) 25/10G SFP28 ports and (6) 100/40G QSFP28 ports. Ideal for high-throughput campus environments with total non-blocking throughput of 1.8 Tbps.

  Dimensions: 442.4 x 43.7 x 496 mm (17.4 x 1.7 x 19.5")
  Weight: 9.9 kg (21.8 lb)
  Max Power Consumption: 340W
  Certifications: CE, FCC, IC

