---
# Shortnames of the UniFi devices, written by the trica project (Apache-2.0), ADR 0056.
#
# A UniFi controller reports a device by a shortname ("USPM24P" for a USW Pro Max 24 PoE),
# which is not always the upstream part_number. Each entry adds its shortnames to the
# part_numbers of the upstream model with that slug, so that a device matches by SKU
# without the upstream file changing. The loader checks every entry (unknown slug, other
# manufacturer, shortname listed twice: the load fails).
#
# An entry may also rename interface templates (interface_names, old: new). The UniFi Network
# application and its Integration API number a device's ports 1..N and the collector names
# them "Port N" (ADR 0060). A model is renamed only when upstream's own names or labels number
# every wired interface exactly once, from 1 to N (a label "Port 9 - WAN 1", a name "SFP+ 25",
# "10G Port 9" or "Port 1 (PoE+)"); each entry says which file it read in an "# evidence:"
# comment. A model whose numbering repeats or skips (SFP 1 after Port 24, an unnumbered MGMT,
# eth0, WAN / LAN1) is left as upstream names it: internal/devicetypes/library_growth_test.go
# lists each with what is missing (#177). The rule rests on an assumption nothing here proves:
# that the "idx" of the Integration API is the number printed on the faceplate. The API
# documents idx as an integer of at least 1 and says no more (Network API 10.6.106, read
# 2026-10-23), and the Ubiquiti tech specs of the UCG-Max, UCG-Fiber, UXG-Pro, USW-Pro-Max-16,
# US-24 and USW-WAN-RJ45 do not number ports (same day): see point 9 of
# internal/collect/unifi/testdata/README.md. A renamed interface that upstream does not label
# keeps its upstream name as label ("Port 1 (PoE+)" -> "Port 1", label "Port 1 (PoE+)").
# An upstream report is drafted in issue #173 (not filed).
#
# Source: Ubiquiti's device fingerprint database, https://static.ui.com/fingerprint/ui/public.json
# (700 devices, read 2026-10-23): the "shortnames" of the record whose "sku" is the model's
# part_number. Models of the database that the library does not have are left out; so are
# the USW-Flex-2.5G family and the CKG2-RM, which it does not list (the three Flex 2.5G
# entries have no part_numbers: they only rename).
manufacturer: Ubiquiti
models:
  # Gateways
