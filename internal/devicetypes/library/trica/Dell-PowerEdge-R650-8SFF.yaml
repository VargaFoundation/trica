---
# Written by the trica project (Apache-2.0); the face images are trica drawings
# (CC0-1.0, sources in drawings/, generator in scripts/devicetype-faces/catalogue.mjs).
#
# A chassis of the Dell PowerEdge R650: 8 x 2.5in drive bays, from the Owner's Manual
# (front view / supported configurations). Rack height, depth, airflow and port templates
# are those of the upstream model Dell/PowerEdge-R650.yaml (netbox-community/devicetype-library, CC0-1.0); power supplies from the manual's back panel.
# Dell reports no chassis part number (the Redfish SKU is the service tag): no part_numbers;
# a device reporting "PowerEdge R650" gets the upstream model, this variant is picked by hand.
manufacturer: Dell
model: PowerEdge R650 8 x 2.5in
slug: dell-poweredge-r650-8sff
variant_of: dell-poweredge-r650
u_height: 1
is_full_depth: true
comments: '[Owner''s Manual](https://dl.dell.com/topicspdf/poweredge-r650_owners-manual_en-us.pdf)'
console-ports:
  - name: Optional Rear Serial
    type: de-9
power-ports:
  - name: PSU1
    type: iec-60320-c14
  - name: PSU2
    type: iec-60320-c14
interfaces:
  - name: Gig-E 1
    type: 1000base-t
  - name: Gig-E 2
    type: 1000base-t
  - name: iDRAC9
    type: 1000base-t
    mgmt_only: true
