---
# Written by the trica project (Apache-2.0); the face images are trica drawings
# (CC0-1.0, sources in drawings/, generator in scripts/devicetype-faces/catalogue.mjs).
#
# A chassis of the Dell PowerEdge R640: 10 x 2.5in drive bays, from the Owner's Manual
# (front view / supported configurations). Rack height, depth, airflow and port templates
# are those of the model Dell/PowerEdge-R640.yaml of this library.
# Dell reports no chassis part number (the Redfish SKU is the service tag): no part_numbers;
# a device reporting "PowerEdge R640" gets the generic model, this variant is picked by hand.
manufacturer: Dell
model: PowerEdge R640 10 x 2.5in
slug: dell-poweredge-r640-10sff
variant_of: dell-poweredge-r640
u_height: 1
is_full_depth: true
comments: '[Owner''s Manual](https://dl.dell.com/topicspdf/poweredge-r640_owners-manual_en-us.pdf)'
console-ports:
  - name: Serial
    type: de-9
power-ports:
  - name: Power 1
    type: iec-60320-c14
    maximum_draw: 750
  - name: Power 2
    type: iec-60320-c14
    maximum_draw: 750
interfaces:
  - name: Gig-E 1
    type: 1000base-t
  - name: Gig-E 2
    type: 1000base-t
  - name: Gig-E 3
    type: 1000base-t
  - name: Gig-E 4
    type: 1000base-t
  - name: iDRAC9
    type: 1000base-t
    mgmt_only: true
