# Written by the trica project (Apache-2.0), ADR 0056.
#
# UniFi Access Door Hub, from the Ubiquiti tech specs
# (https://techspecs.ui.com/unifi/door-access/ua-hub-door, read 2026-10-23) and the
# UniFi device fingerprint database (https://static.ui.com/fingerprint/ui/public.json):
# "Door Hub", SKU UA-Hub-Door; 174.9 x 126 x 32.9 mm, 363 g, DIN rail; 5 x 10/100/1000
# RJ-45 (1 PoE++ in, 4 PoE+ out, 45 W total), 50 W maximum. The tech specs give no port
# names: Port 1 to 5 are trica's. part_numbers holds the model code UniFi reports on a
# controller ("UAH-DOOR"), so that the device matches by SKU. No rack unit (u_height 0).
manufacturer: Ubiquiti
model: Door Hub
slug: ubiquiti-ua-hub-door
part_number: UA-Hub-Door
part_numbers:
  - UAH-DOOR
u_height: 0
is_full_depth: false
airflow: passive
weight: 363
weight_unit: g
comments: '[UA-Hub-Door Techspecs](https://techspecs.ui.com/unifi/door-access/ua-hub-door)'
interfaces:
  - name: Port 1
    type: 1000base-t
  - name: Port 2
    type: 1000base-t
  - name: Port 3
    type: 1000base-t
  - name: Port 4
    type: 1000base-t
  - name: Port 5
    type: 1000base-t
