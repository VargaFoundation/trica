---
# Written by the trica project (Apache-2.0). The library has no other
# DCS-7280SE-64 (it has the -68 and -72). Built from the
# Arista 7280E data sheet: 1U, 48 x 1/10GbE SFP+ and 4 x 40GbE QSFP+, two
# hot-swap power supplies, front-to-rear (-F) or rear-to-front (-R) airflow.
# The depth is taken from the DCS-7280SE-68 of the same family; the weight,
# 10.0 kg, is the data sheet's model comparison. The face images are trica
# drawings (CC0-1.0, sources in drawings/): 48 SFP+ in three groups of 16,
# QSFP+ 49-52, management, console and USB on the port side; PS1, four fans
# and PS2 on the other.
manufacturer: Arista
model: DCS-7280SE-64-F
slug: arista-dcs-7280se-64-f
part_number: DCS-7280SE-64-F
u_height: 1
is_full_depth: true
airflow: front-to-rear
weight: 10.0
weight_unit: kg
comments: '[Arista 7280E Data Sheet](https://www.arista.com/assets/data/pdf/Datasheets/7280E-Datasheet.pdf)'
console-ports:
  - name: Console
    type: rj-45
power-ports:
