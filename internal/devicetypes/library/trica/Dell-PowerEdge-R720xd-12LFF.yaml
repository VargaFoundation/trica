---
# Written by the trica project (Apache-2.0); the face images are trica drawings
# (CC0-1.0, sources in drawings/, generator in scripts/devicetype-faces/catalogue.mjs).
#
# A chassis of the Dell PowerEdge R720xd: 12 x 3.5in drive bays, from the Owner's Manual
# (front view / supported configurations). Rack height, depth, airflow and port templates
# are those of the upstream model Dell/PowerEdge-R720xd.yaml (netbox-community/devicetype-library, CC0-1.0).
# Dell reports no chassis part number (the Redfish SKU is the service tag): no part_numbers;
# a device reporting "PowerEdge R720xd" gets the upstream model, this variant is picked by hand.
manufacturer: Dell
model: PowerEdge R720xd 12 x 3.5in
slug: dell-poweredge-r720xd-12lff
variant_of: dell-poweredge-r720xd
u_height: 2
is_full_depth: true
comments: '[Owner''s Manual](https://dl.dell.com/topicspdf/poweredge-r720_owners-manual_en-us.pdf)'
console-ports:
  - name: Serial
    type: de-9
power-ports:
  - name: Power 1
    type: iec-60320-c14
  - name: Power 2
    type: iec-60320-c14
interfaces:
  - name: Gig-E 1
    type: 1000base-t
  - name: Gig-E 2
    type: 1000base-t
  - name: Gig-E 3
    type: 1000base-t
  - name: Gig-E 4
    type: 1000base-t
  - name: iDRAC
    type: 1000base-t
    mgmt_only: true
