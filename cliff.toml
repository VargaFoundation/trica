# git-cliff: the changelog of a release, from conventional commits.
[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first | split(pat="\n") | first }}{% if commit.scope %} (`{{ commit.scope }}`){% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(chore|ci|build|refactor|style|test)", skip = true },
]
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
