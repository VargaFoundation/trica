# Pull request CI. `ci-ok` is the single required check.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # paths-filter asks the API for the PR's files; a Dependabot PR's token only
    # carries what the workflow declares.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      chart: ${{ steps.filter.outputs.chart }}
      image: ${{ steps.filter.outputs.image }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/*.sql'
              - '**/*.yaml'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'packaging/**'
              - 'deploy/**'
              - '.golangci.yml'
              # The API contract snapshot the Go tests compare with the served document.
              - 'web/openapi.json'
            chart:
              - 'charts/**'
              - 'scripts/release-version-check.sh'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - '**/*.go'
              - '**/*.sql'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/compose/**'
              - 'web/**'
            web:
              - 'web/**'
              - 'internal/web/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A real PostgreSQL: the store relies on tstzrange, GiST exclusion and
    # pg_trgm. TRICA_REQUIRE_DB=1 turns a skipped integration test into a
    # failure, so a missing database cannot make the suite look green.
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: trica, POSTGRES_PASSWORD: trica, POSTGRES_DB: trica }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trica" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRICA_TEST_DATABASE_URL: postgres://trica:trica@localhost:5432/trica?sslmode=disable
      TRICA_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.14.0 }
      - name: PostgreSQL 17 client tools (the backup tests run pg_dump and pg_restore)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # The postgresql-common wrappers on PATH may pick another major
          # version for pg_restore: use the 17 binaries directly.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - run: make vet
      - run: make test-cov
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage, path: coverage.out, if-no-files-found: ignore }

  agent:
    # The agent as shipped: static binary, deb and rpm (unsigned: signing is the
    # release pipeline's job), and its real footprint on this runner. The
    # footprint fails the job above 50 MB resident or 1 % of a core, measured as
    # root over a full collection cycle of the real binary on the real host.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: make package-agent
      - name: the packages hold the binary, the unit and the user definition
        run: |
          for f in dist/*.deb; do
            files=$(dpkg-deb -c "$f")
            for want in ./usr/bin/trica-agent ./usr/lib/systemd/system/trica-agent.service ./usr/lib/sysusers.d/trica-agent.conf; do
              echo "$files" | grep -q " $want\$" || { echo "::error::$f lacks $want"; exit 1; }
            done
          done
          test "$(ls dist/*.rpm | wc -l)" -eq 2
      - run: make agent-footprint
  chart:
    # The chart renders, validates against the Kubernetes schemas and keeps
    # its guards (helm-unittest): no database Secret, no render.
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v3.20.1 }
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2
      - run: helm lint charts/trica --set database.existingSecret=ci
      - run: helm unittest charts/trica
      - name: the release version guard accepts the chart's version and refuses another
        run: |
          scripts/release-version-check.sh "v$(awk '/^version:/ {print $2}' charts/trica/Chart.yaml)"
          if scripts/release-version-check.sh v999.0.0; then echo "guard accepted a wrong tag"; exit 1; fi
      - name: kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template ci charts/trica --set database.existingSecret=ci \
            --set serviceMonitor.enabled=true --set podDisruptionBudget.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version 1.31.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  image:
    # The image builds, its binary runs, and the compose file is valid.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION=ci -t trica:ci .
      - run: test "$(docker run --rm trica:ci version)" = ci
      - run: TRICA_DB_PASSWORD=ci docker compose -f deploy/compose/compose.yaml config --quiet
      - name: the compose install serves a ready server
        # The getting-started path, end to end: PostgreSQL starts, trica
        # migrates and answers /readyz. The elapsed time is printed, not
        # asserted: a runner is not the operator's machine.
        env:
          TRICA_DB_PASSWORD: ci
          TRICA_IMAGE: trica:ci
        run: |
          t0=$(date +%s)
          docker compose -f deploy/compose/compose.yaml -p trica-ci up -d --no-build --wait --wait-timeout 300
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/metrics | grep -q 'trica_build_info{version="ci"} 1'
          echo "ready after $(( $(date +%s) - t0 ))s"
      - name: backup, lose the database, restore from the archive (under 15 minutes)
        # ADR 0021, the packaged path: the ops image, the compose `ops` service
        # and the real postgres:17 container. The dataset proof (2,000
        # devices, identical tables, history) is the Go test in internal/backup;
        # this step proves the operator's commands and the 15-minute budget.
        env:
          TRICA_DB_PASSWORD: ci
          TRICA_IMAGE: trica:ci
          TRICA_OPS_IMAGE: trica-ops:ci
        run: |
          dc="docker compose -f deploy/compose/compose.yaml -p trica-ci"
          docker build --target ops --build-arg VERSION=ci -t trica-ops:ci .
          before=$($dc run -T --rm ops migrate status)
          $dc run -T --rm ops backup --file /backups/ci.dump
          $dc stop trica
          $dc exec -T postgres psql -U trica -d postgres -c 'DROP DATABASE trica WITH (FORCE)' -c 'CREATE DATABASE trica'
          t0=$(date +%s)
          $dc run -T --rm ops restore --file /backups/ci.dump
          secs=$(( $(date +%s) - t0 ))
          echo "restore took ${secs}s (budget 900s)"
          test "$secs" -le 900
          test "$($dc run -T --rm ops migrate status)" = "$before"
          $dc up -d --no-build --wait --wait-timeout 300 trica
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/readyz
          # A second restore over a populated database is refused, not applied.
          if $dc run -T --rm ops restore --file /backups/ci.dump; then echo "restore over a populated database was accepted"; exit 1; fi
      - name: compose logs on failure
        if: failure()
        run: TRICA_DB_PASSWORD=ci docker compose -f deploy/compose/compose.yaml -p trica-ci logs

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Everything runs from the lockfile (`npm ci`); a dependency that is not in
    # web/package-lock.json is not tested. The Go half proves the built UI works
    # under the CSP the handler sends (build tag webui).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - run: make web-lint
      - run: make web-typecheck
      - run: make web-api-check
      - run: make web-test
      - run: make web-audit
      - run: make web-build
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: make web-embed-test

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The UI in a real browser (Chromium only), against cmd/trica-e2e-server:
    # the real internal/web handler, a mock API and a fake OpenID provider.
    # Every page is checked with axe-core, WCAG 2.2 A and AA, contrast included.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: make web-install
      - run: make web-build
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # The browser build is fixed by the Playwright version, which the lockfile fixes.
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npm --prefix web run e2e:install
      - name: Install the system libraries only (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npm --prefix web exec -- playwright install-deps chromium
      - run: make web-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  secrets:
    # A committed secret cannot be taken back: it is already in the history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Only the history of the checked-out commit (for a pull request, the
      # merge of the PR into its base): by default gitleaks scans every ref,
      # and a full clone fetches every branch, so one leaking branch would fail
      # every other pull request.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml --log-opts=HEAD --redact --exit-code 1 --no-banner

  dco:
    # Every commit certifies the Developer Certificate of Origin (file `DCO`)
    # with a Signed-off-by line. A certificate nobody checks is decoration.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: every commit carries a Signed-off-by
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit without Signed-off-by: $sha $(git show -s --format=%s "$sha")"
              missing=$((missing + 1))
            fi
          done <<< "$(git rev-list "$base..$head")"
          if [ "$missing" -gt 0 ]; then
            echo "$missing unsigned commit(s). Use 'git commit --amend -s' or" \
                 "'git rebase --signoff $base'. See DCO and docs/CONTRIBUTING.md."
            exit 1
          fi

  ci-ok:
    # The single target for branch protection and the merge queue. It accepts
    # only `success` and `skipped`: whatever else GitHub reports closes the gate.
    # `changes` is in the list because a failed filter skips every job after
    # it, and a gate that only sees skipped jobs is green.
    needs: [changes, go, agent, chart, image, web, e2e, secrets, dco]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job succeeded or was skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -o '"result": "[a-z_]*"' | grep -qvE '"result": "(success|skipped)"'; then
            exit 1
          fi
