# Everything is grouped: an upgrade that touches four packages at once is one
# decision, not four PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      go-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
